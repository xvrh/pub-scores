name: 'Cron task'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: write
  pull-requests: write
  checks: write
jobs:
  test:
    name: 'Update file'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/checkout@v4
      - run: dart pub get
      - run: dart tool/cron_task.dart
        env:
          GITHUB_DART_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dart test
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch-suffix: timestamp
          title: Update pub scores data
      # PRs opened with the default GITHUB_TOKEN never fire the pull_request
      # workflow, and master requires the 'Run tests' check. The `dart test`
      # step above is the real gate: report it as the required check run
      # (GITHUB_TOKEN is a GitHub Actions app token, so the check run comes
      # from the same app branch protection expects), then merge.
      - name: Report check and merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Run tests' \
            -f head_sha='${{ steps.cpr.outputs.pull-request-head-sha }}' \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=dart test' \
            -f 'output[summary]=dart test passed in the cron job before the PR was created'
          for i in 1 2 3 4 5 6; do
            if gh pr merge '${{ steps.cpr.outputs.pull-request-number }}' --squash --delete-branch; then
              exit 0
            fi
            sleep 10
          done
          echo 'Pull request never became mergeable'
          exit 1
