name: 'Cron task'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  test:
    name: 'Update file'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/checkout@v4
      - run: dart pub get
      - run: dart tool/cron_task.dart
        env:
          GITHUB_DART_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dart test
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch-suffix: timestamp
          title: Update pub scores data
      # PRs opened with the default GITHUB_TOKEN don't fire `pull_request`
      # workflows, and master requires the 'Run tests' check. Dispatch the test
      # workflow on the PR branch, wait for it, then merge.
      - name: Run required checks and merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch='${{ steps.cpr.outputs.pull-request-branch }}'
          gh workflow run test.yaml --ref "$branch"
          for i in $(seq 1 30); do
            run_id=$(gh run list --workflow=test.yaml --branch="$branch" --event=workflow_dispatch --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'Dispatched test run never appeared'
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          gh pr merge '${{ steps.cpr.outputs.pull-request-number }}' --squash --delete-branch
